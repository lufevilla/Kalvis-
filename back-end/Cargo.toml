[package]
name = "back-end"
version = "0.1.0"
edition = "2024"

[dependencies]

# Shared library
rust_lib_front_end = { path = "../space-health-lib" }

# HTTP / API
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Runtime assíncrono
tokio = { version = "1.54.1", features = ["full"] }

# Serialização JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Banco de dados SQLite
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "uuid"
] }

# Traits assíncronas
async-trait = "0.1"

# Identificadores
uuid = { version = "1", features = ["v4", "serde"] }

# Datas e horários
chrono = { version = "0.4", features = ["serde"] }

# Tratamento de erros
thiserror = "2"
anyhow = "1"

# Logs e observabilidade
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt"
] }

# Variáveis de ambiente
dotenvy = "0.15"

# Comunicação com serviços externos / IA
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls"
] }
rand = "0.8"
